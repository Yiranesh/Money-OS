<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Receipt Not Found | Money OS</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .error-receipt {
      max-width: 440px;
      width: 100%;
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: var(--hard-shadow-lg);
      padding: 2.5rem 2rem;
      position: relative;
      font-family: var(--font-receipt);
      transform: rotate(-1.5deg);
    }
    .error-receipt::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -3px;
      right: -3px;
      height: 10px;
      background-image: 
        linear-gradient(45deg, var(--paper) 50%, transparent 50%),
        linear-gradient(-45deg, var(--paper) 50%, transparent 50%);
      background-size: 16px 10px;
      background-position: 0 0, 8px 0;
    }
    .error-receipt::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: -3px;
      right: -3px;
      height: 10px;
      background-image: 
        linear-gradient(135deg, var(--paper) 50%, transparent 50%),
        linear-gradient(-135deg, var(--paper) 50%, transparent 50%);
      background-size: 16px 10px;
      background-position: 0 0, 8px 0;
    }
  </style>
</head>
<body style="background-color: var(--cobalt);">

  <div class="not-found-wrapper">
    <div class="error-receipt">
      <div style="text-align: center; border-bottom: 2px dashed var(--ink); padding-bottom: 1rem; margin-bottom: 1.5rem;">
        <div style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800;">MONEY OS</div>
        <div style="font-size: 0.8rem; color: #4a537d;">ERROR TICKET // 404</div>
      </div>

      <div style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--ink);">
        PAGE_STATUS ......... 404 NOT FOUND
      </div>
      <p style="font-family: var(--font-body); font-size: 1.05rem; line-height: 1.5; margin-bottom: 1.75rem; color: #313866;">
        The budget slip or page you requested does not exist or has been torn away.
      </p>

      <div style="text-align: center;">
        <a href="/" class="btn btn-primary" style="width: 100%;">
          Return to home page
        </a>
      </div>

      <div style="margin-top: 1.75rem; padding-top: 1rem; border-top: 2px dashed var(--ink); text-align: center; font-size: 0.75rem; color: #4a537d;">
        * * * RETURN TO BUDGET RECEIPT * * *
      </div>
    </div>
  </div>

</body>
</html>
